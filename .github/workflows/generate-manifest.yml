name: Generate portfolio manifest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Check generated manifest
        run: npm run generate:check
